# disclosure-verifier configuration.
#
# Every machine-local value the pipeline needs lives here; CLI flags override
# individual values for a single run (see `python3 -m disclosure_verifier --help`).
# Stage order (A, B, C, ...) follows the [[evaluators]] order below.

repo_root = "/home/opencode/src/tomcat"
disclosures_dir = "/home/opencode/workspace/security-scans/tomcat/disclosures"
security_model = "/home/opencode/workspace/security-scans/tomcat/SECURITY-MODEL.md"
# JARs for the scratch-copy JUnit runs; omit (or leave empty) to skip test execution.
jar_dir = "/home/opencode/tomcat-build-libs"

[lmstudio]
url = "http://127.0.0.1:1234"

[generation]
# Fixed for determinism.
seed = 1337
temperature = 0.0
top_p = 1.0
max_tokens_eval = 8192
max_tokens_final = 16384

[pipeline]
run_tests = true
postpatch = true

# Stage A — primary evaluator.
[[evaluators]]
name = "27b"
model_key = "qwen/qwen3.8-27b"
ctx_tokens = 65536
input_budget_chars = 140_000

# Stage B — small independent second opinion.
[[evaluators]]
name = "7b"
model_key = "vulnllm-r-7b"
ctx_tokens = 32768
input_budget_chars = 80_000

# Stage C — adversarial vulnerability-hunting model; argues hardest that
# findings ARE security issues. Heavy reasoner: may exhaust max_tokens_eval
# on internal reasoning (raise it in [generation] for reliable verdicts).
[[evaluators]]
name = "cyber"
model_key = "ravenx-cyberagent-qwen3.6-35b-a3b-opus-4.7-openmythos-pentester-bughunter-rath"
ctx_tokens = 98304
input_budget_chars = 140_000

# Stage D — final authority; sees all evaluator verdicts + mechanical facts.
[adjudicator]
model_key = "qwen/qwen3.8-27b"
ctx_tokens = 65536
input_budget_chars = 140_000
